<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Intermezzo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:       #0d0f17;
  --card:     #161925;
  --border:   #252a3a;
  --text:     #e4e8f0;
  --muted:    #6b7291;
  --accent:   #5b8fd4;
  --gold:     #f0a030;
  --red:      #e05050;
  --orange:   #e08830;
  --green:    #50c878;
  --lt-sq:    #efdfc0;
  --dk-sq:    #4a7db5;
  --hl-from:  rgba(245,210,60,0.50);
  --hl-to:    rgba(245,210,60,0.82);
}

html, body {
  height: 100%; width: 100%;
  font-family: 'Space Mono', monospace;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

/* ── SCREENS ── */
.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  background: var(--bg);
}
.screen.hidden { display: none; }
.hidden { display: none !important; }

/* ── SETTINGS ── */
#s-settings {
  padding: max(env(safe-area-inset-top),48px) 24px 32px;
  overflow-y: auto; gap: 0;
}
.logo { font-size: 26px; font-weight: 700; letter-spacing: -1px; margin-bottom: 4px; }
.logo-sub {
  font-size: 10px; color: var(--muted);
  letter-spacing: 2.5px; text-transform: uppercase;
  margin-bottom: 44px;
}
.field { margin-bottom: 22px; }
.field > label {
  display: block; font-size: 10px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
}
.finput {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 13px; outline: none;
  transition: border-color .2s;
}
.finput:focus { border-color: var(--accent); }
.tone-row { display: flex; gap: 8px; }
.tone {
  flex: 1; padding: 12px 6px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px; color: var(--muted);
  font-family: 'Space Mono', monospace;
  font-size: 11px; cursor: pointer;
  transition: all .2s; text-align: center;
}
.tone.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.primary {
  width: 100%; padding: 18px;
  background: var(--accent); border: none;
  border-radius: 10px; color: #fff;
  font-family: 'Space Mono', monospace;
  font-size: 14px; font-weight: 700;
  cursor: pointer; letter-spacing: .5px;
  margin-top: 10px;
  transition: opacity .15s, transform .1s;
}
.primary:active { opacity: .85; transform: scale(.99); }
.key-row { display: flex; gap: 8px; margin-top: 10px; }
.key-btn {
  flex: 1; padding: 13px 6px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px; color: var(--muted);
  font-family: 'Space Mono', monospace;
  font-size: 11px; cursor: pointer;
  transition: all .2s; text-align: center;
}
.key-btn:active { opacity: .7; }

/* ── HOME ── */
#s-home {
  padding: max(env(safe-area-inset-top),32px) 24px 24px;
}
.home-hdr {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 28px;
}
.home-hdr h2 { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
.icon-btn {
  width: 38px; height: 38px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 50%; color: var(--muted);
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#pgn {
  width: 100%; flex: 1;
  min-height: 160px; max-height: 240px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px; color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 11px; line-height: 1.75;
  outline: none; resize: none;
  transition: border-color .2s;
}
#pgn:focus { border-color: var(--accent); }
#pgn::placeholder { color: var(--muted); opacity: .65; }
#btn-go {
  width: 100%; padding: 18px;
  background: var(--accent); border: none;
  border-radius: 10px; color: #fff;
  font-family: 'Space Mono', monospace;
  font-size: 14px; font-weight: 700;
  cursor: pointer; margin-top: 14px;
  transition: opacity .15s;
}
#btn-go:active { opacity: .85; }
#btn-profile {
  width: 100%; padding: 14px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 10px; color: var(--muted);
  font-family: 'Space Mono', monospace;
  font-size: 12px; cursor: pointer;
  margin-top: 10px; transition: all .2s;
}
#btn-profile:active { opacity: .7; }
#gcount {
  font-size: 11px; color: var(--muted);
  text-align: center; padding: 14px 0;
}

/* ── LOADING ── */
#s-loading {
  align-items: center; justify-content: center; gap: 22px;
}
.spin-ring {
  width: 42px; height: 42px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#s-loading p {
  font-size: 11px; color: var(--muted);
  letter-spacing: 3px; text-transform: uppercase;
}
.dots::after {
  content: '';
  animation: dotdot 1.5s steps(4,end) infinite;
}
@keyframes dotdot {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}

/* ── GAME ── */
#s-game {
  justify-content: space-between;
  padding-top: env(safe-area-inset-top, 0px);
}
.g-top {
  display: flex; justify-content: space-between;
  align-items: center; padding: 10px 20px;
  flex-shrink: 0;
}
.pinfo { font-size: 12px; color: var(--muted); min-width: 110px; }
.pinfo strong { display: block; font-size: 14px; color: var(--text); font-weight: 700; }
.pinfo.r { text-align: right; }
#btn-exit {
  background: none; border: none;
  color: var(--muted); font-size: 18px;
  cursor: pointer; padding: 8px;
}
.statusbar {
  height: 22px; flex-shrink: 0;
  display: flex; align-items: center;
  justify-content: center; gap: 10px;
}
#key-lbl {
  font-size: 11px; color: var(--gold);
  font-weight: 700; letter-spacing: 2px;
  min-width: 20px; text-align: center;
}
.audiodot {
  width: 7px; height: 7px;
  border-radius: 50%; background: var(--border);
  transition: background .2s;
}
.audiodot.on {
  background: var(--accent);
  animation: blink .9s ease-in-out infinite;
}
@keyframes blink {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:.4; transform:scale(.75); }
}
#board-wrap {
  width: 100%; aspect-ratio: 1/1;
  flex-shrink: 0; cursor: pointer;
  user-select: none;
}
#board {
  width: 100%; height: 100%;
  display: grid;
  grid-template-columns: repeat(8,1fr);
  grid-template-rows: repeat(8,1fr);
}
.sq {
  display: flex; align-items: center;
  justify-content: center; position: relative;
}
.sq.lt { background: var(--lt-sq); }
.sq.dk { background: var(--dk-sq); }
.sq.hf  { background: var(--hl-from) !important; }
.sq.ht  { background: var(--hl-to)   !important; }
.coord {
  position: absolute; font-size: 9px; font-weight: 700;
  line-height: 1; pointer-events: none; opacity: .75;
}
.coord-rank { top: 2px; left: 3px; }
.coord-file { bottom: 2px; right: 3px; }
.sq.lt .coord { color: #7a5c2a; }
.sq.dk .coord { color: #c8dff5; }
.piece {
  font-size: min(10vw, 54px);
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.piece.w {
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.6);
}
.piece.b {
  color: #0e1118;
  text-shadow: 0 1px 2px rgba(255,255,255,.15);
}
.navbar {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 12px 28px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  flex-shrink: 0;
}
.nbtn {
  width: 52px; height: 52px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 50%; color: var(--text);
  font-size: 20px; cursor: pointer;
  display: flex; align-items: center;
  justify-content: center;
  transition: all .15s;
  font-family: inherit;
}
.nbtn:active { background: var(--border); transform: scale(.94); }
.nbtn:disabled { opacity: .22; cursor: default; transform: none; }
.nav-mid {
  display: flex; align-items: center; justify-content: center;
  min-width: 90px;
}
#movlbl {
  font-size: 13px; color: var(--muted);
  letter-spacing: 1px; text-align: center;
}
.start-capsule {
  background: var(--accent); border: none;
  border-radius: 999px; padding: 11px 26px;
  color: #fff; font-family: 'Space Mono', monospace;
  font-size: 13px; font-weight: 700; letter-spacing: .5px;
  cursor: pointer; white-space: nowrap;
}
@keyframes capsule-tap {
  0%   { transform: scale(1);    opacity: 1; }
  50%  { transform: scale(.88);  opacity: .8; }
  100% { transform: scale(1.08); opacity: 0; }
}
.start-capsule.tapping { animation: capsule-tap .32s ease-out forwards; }

/* ── EVAL BAR ── */
#eval-bar-wrap {
  width: 100%; height: 10px;
  background: #1a1a2e; flex-shrink: 0;
  position: relative; overflow: hidden;
}
#eval-bar-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: #f0f0f0;
  transition: width .25s ease;
  width: 50%;
}
#eval-bar-label {
  position: absolute; right: 6px; top: 50%;
  transform: translateY(-50%);
  font-size: 8px; color: var(--muted);
  letter-spacing: .5px; pointer-events: none;
}

/* ── MOVE DOT STRIP ── */
#dot-strip-wrap {
  width: 100%; flex-shrink: 0;
  overflow-x: auto; overflow-y: hidden;
  padding: 6px 12px 4px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#dot-strip-wrap::-webkit-scrollbar { display: none; }
#dot-strip {
  display: flex; align-items: center;
  gap: 4px; min-width: max-content;
}
.mdot {
  width: 8px; height: 8px;
  border-radius: 50%; flex-shrink: 0;
  background: var(--border);
  cursor: pointer;
  transition: transform .1s;
}
.mdot:active { transform: scale(1.3); }
.mdot.blunder  { background: var(--red); }
.mdot.mistake  { background: var(--orange); }
.mdot.inaccuracy { background: var(--gold); opacity: .6; }
.mdot.good-key { background: var(--green); }
.mdot.has-comment { background: var(--accent); opacity: .6; }
.mdot.current {
  box-shadow: 0 0 0 2px var(--text);
  transform: scale(1.2);
}

/* ── PLAY COMMENT BUTTON ── */
#btn-play-comment {
  width: 52px; height: 52px;
  background: var(--accent);
  border: none; border-radius: 50%;
  color: #fff; font-size: 18px;
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
#btn-play-comment:active { opacity: .8; transform: scale(.94); }

/* ── ERROR TOAST ── */
#toast {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #c0392b; color: #fff;
  padding: 12px 20px; border-radius: 8px;
  font-size: 12px; max-width: 90vw;
  text-align: center; z-index: 999;
  transition: transform .3s;
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }
</style>

<body>

  <textarea id="pgn" placeholder="Paste PGN here…&#10;&#10;[Event &quot;Live Chess&quot;]&#10;[White &quot;…&quot;]&#10;[Black &quot;…&quot;]&#10;&#10;1. e4 e5 2. Nf3 …"></textarea>

</div>

<!-- GAME -->
<div id="s-game" class="screen hidden">
  <div class="g-top">
    <div class="pinfo" id="opp-info"></div>
    <button id="btn-exit">✕</button>
    <div class="pinfo r" id="my-info"></div>
  </div>

  <div class="statusbar">
    <span id="key-lbl"></span>

  </div>

  <div id="board-wrap">
    <div id="board"></div>
  </div>

  <div id="eval-bar-wrap" class="hidden">
    <div id="eval-bar-fill"></div>
    <span id="eval-bar-label"></span>
  </div>

    <div id="dot-strip"></div>
  </div>

  <div class="navbar">
    <button class="nbtn" id="btn-prev">←</button>
    <div class="nav-mid">
      <span id="movlbl">START</span>
      <button id="btn-start" class="start-capsule hidden">▶ Start</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button id="btn-play-comment" class="hidden">▶</button>
      <button class="nbtn" id="btn-next">→</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
// ─────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────
const S = {
  dsKey: '', orKey: '', username: '', tone: 'club',
  games: [],
  // per-game
  positions: [], hist: [], analysis: null, annotations: null,
  idx: -1, flip: false, curAudio: null, pendingOverview: null
};

// ─────────────────────────────────────────
//  PIECES
// ─────────────────────────────────────────
const PC = {
  wk:'♔', wq:'♕', wr:'♖', wb:'♗', wn:'♘', wp:'♙',
  bk:'♚', bq:'♛', br:'♜', bb:'♝', bn:'♞', bp:'♟'
};

// ─────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────
const $  = id => document.getElementById(id);
const pv = sel => document.querySelectorAll(sel);

function show(id) {
  pv('.screen').forEach(s => s.classList.add('hidden'));
  $(id).classList.remove('hidden');
}

function toast(msg, dur = 3500) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

function pgHeader(pgn, tag) {
  const m = pgn.match(new RegExp(`\\[${tag} "([^"]+)"\\]`));
  return m ? m[1] : '';
}

// Returns array (one per half-move) of { eval, isMate, classification, bestMove }
// classification: 'blunder' | 'mistake' | 'inaccuracy' | null
function parseAnnotations(pgn) {
  const results = [];
  // Strip header lines
  let body = pgn.replace(/^\[.*\]\s*$/gm, '').trim();

  // Strip variation branches (nested parens) — main-line only
  let prev;
  do { prev = body; body = body.replace(/\([^()]*\)/g, ''); } while (body !== prev);

  // Split on move tokens and capture comment blocks that follow them
  // Each "unit" is: optional move number+dots, a move SAN, then zero or more {...} blocks
  const moveRe = /(?:\d+\.{1,3}\s*)?([^\s{]+)\s*((?:\{[^}]*\}\s*)*)/g;
  let match;
  while ((match = moveRe.exec(body)) !== null) {
    const san = match[1];
    const comments = match[2] || '';
    // Skip variation markers or result tokens
    if (/^[()01*]/.test(san)) continue;

    let evalScore = null;
    let isMate = false;
    let classification = null;
    let bestMove = null;

    // Extract all {...} blocks
    const blocks = [...comments.matchAll(/\{([^}]*)\}/g)].map(m => m[1]);
    for (const block of blocks) {
      // [%eval #N] — mate
      const mateM = block.match(/\[%eval #(-?\d+)\]/);
      if (mateM) { isMate = true; evalScore = parseInt(mateM[1], 10); }
      // [%eval N.NN]
      else {
        const evalM = block.match(/\[%eval (-?\d+(?:\.\d+)?)\]/);
        if (evalM) evalScore = parseFloat(evalM[1]);
      }
      // Classification: "Blunder. Nf3 was best." etc.
      const clsM = block.match(/\b(Blunder|Mistake|Inaccuracy)\b/i);
      if (clsM) {
        classification = clsM[1].toLowerCase();
        const bestM = block.match(/(?:Blunder|Mistake|Inaccuracy)\.\s+(\S+)\s+was best/i);
        if (bestM) bestMove = bestM[1];
      }
    }

    results.push({ eval: evalScore, isMate, classification, bestMove });
  }

  return results;
}

// Convert eval score to a 0–100 bar fill (50 = equal)
function evalToBarPct(evalScore, isMate) {
  if (isMate) return evalScore > 0 ? 97 : 3;
  if (evalScore === null) return 50;
  // Clamp to ±500cp, map to 10–90%
  const clamped = Math.max(-500, Math.min(500, evalScore));
  return 50 + (clamped / 500) * 40;
}

// ─────────────────────────────────────────
//  SETTINGS
// ─────────────────────────────────────────
pv('.tone').forEach(b => {
  b.onclick = () => {
    pv('.tone').forEach(t => t.classList.remove('on'));
    b.classList.add('on');
    S.tone = b.dataset.v;
    const saved = localStorage.getItem('iz_keys');
    if (saved) { try { const d = JSON.parse(saved); d.tone = S.tone; localStorage.setItem('iz_keys', JSON.stringify(d)); } catch (_) {} }
  };
});

$('btn-save').onclick = () => {
  const dk = $('f-ds').value.trim();
  const ok = $('f-or').value.trim();
  const un = $('f-user').value.trim();
  if (!dk) return toast('DeepSeek API key is required.');
  if (!un) return toast('Enter your chess username.');
  S.dsKey = dk; S.orKey = ok; S.username = un;
  localStorage.setItem('iz_keys', JSON.stringify({ dsKey: dk, orKey: ok, username: un, tone: S.tone }));
  show('s-home');
  refreshHome();
};

$('btn-tosettings').onclick = () => {
  $('f-ds').value   = S.dsKey;
  $('f-or').value   = S.orKey;
  $('f-user').value = S.username;
  // restore tone button
  pv('.tone').forEach(b => {
    b.classList.toggle('on', b.dataset.v === S.tone);
  });
  show('s-settings');
};

$('btn-export').onclick = () => {
  const data = { dsKey: $('f-ds').value.trim(), orKey: $('f-or').value.trim(), username: $('f-user').value.trim(), tone: S.tone };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'intermezzo-keys.json'; a.click();
  URL.revokeObjectURL(url);
};

$('btn-import').onclick = () => $('f-import').click();

let updatePending = false;
$('btn-update').onclick = async () => {
  if (updatePending) { location.reload(true); return; }
  const btn = $('btn-update');
  btn.textContent = '⟳ Checking…';
  btn.disabled = true;
  try {
    const url = location.href.split('?')[0] + '?t=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    const html = await res.text();
    const remoteM = html.match(/<!--\s*version:\s*([\w.-]+)\s*-->/);
    const localM  = document.documentElement.outerHTML.match(/<!--\s*version:\s*([\w.-]+)\s*-->/);
    const remote = remoteM ? remoteM[1] : null;
    const local  = localM  ? localM[1]  : null;
    if (remote && remote !== local) {
      updatePending = true;
      btn.textContent = '↑ Reload for update';
      btn.disabled = false;
    } else {
      btn.textContent = '✓ Up to date';
      setTimeout(() => { btn.textContent = '⟳ Update'; btn.disabled = false; }, 2500);
    }
  } catch {
    btn.textContent = '⟳ Update';
    btn.disabled = false;
    toast('Could not check for updates.');
  }
};

$('f-import').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.dsKey)    { $('f-ds').value   = d.dsKey; }
      if (d.orKey)    { $('f-or').value   = d.orKey; }
      if (d.username) { $('f-user').value = d.username; }
      if (d.tone)     { S.tone = d.tone; pv('.tone').forEach(b => b.classList.toggle('on', b.dataset.v === d.tone)); }
      toast('Keys imported — tap Continue to save.');
    } catch { toast('Invalid file.'); }
    e.target.value = '';
  };
  reader.readAsText(file);
};

// ─────────────────────────────────────────
//  HOME
// ─────────────────────────────────────────
function refreshHome() {
  const n = S.games.length;
  $('gcount').textContent = n ? `${n} game${n > 1 ? 's' : ''} analyzed` : '';
  $('btn-profile').classList.toggle('hidden', n === 0);
}

$('btn-go').onclick = async () => {
  const pgn = $('pgn').value.trim();
  if (!pgn) return toast('Paste a PGN first.');
  const test = new Chess();
  if (!test.load_pgn(pgn, { sloppy: true }))
    return toast('Invalid PGN — check the format.');
  show('s-loading');
  try {
    const analysis = await fetchAnalysis(pgn);
    loadGame(pgn, analysis);
    show('s-game');
  } catch (e) {
    toast('Analysis failed: ' + e.message);
    show('s-home');
  }
};

$('btn-profile').onclick = async () => {
  if (!S.games.length) return;
  show('s-loading');
  try {
    const txt = await fetchProfile();
    show('s-home');
    refreshHome();
    speak(txt);
  } catch (e) {
    toast('Profile failed: ' + e.message);
    show('s-home');
  }
};

$('btn-exit').onclick = () => {
  stopAudio();
  $('pgn').value = '';
  $('eval-bar-wrap').classList.add('hidden');
  $('dot-strip-wrap').classList.add('hidden');
  show('s-home');
  refreshHome();
};

// ─────────────────────────────────────────
//  DEEPSEEK API — ANALYSIS
// ─────────────────────────────────────────
async function fetchAnalysis(pgn) {
  const toneMap = {
    beginner: 'simple, encouraging language — avoid technical jargon',
    club:     'club-player level with standard chess terminology',
    advanced: 'deep tactical and positional analysis with precise chess vocabulary'
  };

  const wName = pgHeader(pgn, 'White');
  const bName = pgHeader(pgn, 'Black');
  const un    = S.username.toLowerCase();
  const side  = wName.toLowerCase() === un ? 'White'
              : bName.toLowerCase() === un ? 'Black'
              : 'White';

  const c = new Chess();
  c.load_pgn(pgn, { sloppy: true });
  const hist  = c.history({ verbose: true });
  const total = hist.length;

  const isAnnotated = /%eval/.test(pgn);
  const annotations = isAnnotated ? parseAnnotations(pgn) : null;

  let prompt;

  if (isAnnotated && annotations) {
    // Build a concise table of only the flagged moves
    const flaggedLines = [];
    annotations.forEach((ann, i) => {
      if (!ann.classification) return;
      const mv   = hist[i];
      if (!mv) return;
      const num  = Math.floor(i / 2) + 1;
      const clr  = mv.color === 'w' ? 'White' : 'Black';
      const san  = mv.san;
      const best = ann.bestMove ? `, best was ${ann.bestMove}` : '';
      flaggedLines.push(`  moveIndex=${i}  Move ${num} (${clr}, ${san}): ${ann.classification.toUpperCase()}${best}`);
    });
    const flaggedTable = flaggedLines.join('\n') || '  (none flagged)';

    prompt =
`You are a chess coach reviewing a game for ${S.username} who played ${side}.
Use ${toneMap[S.tone]}. Be warm, direct, and instructional — like a coach pausing at the key moments, not narrating every move.

PGN:
${pgn}

Engine analysis has already identified these key mistakes:
${flaggedTable}

Your job:
1. Write a short spoken overview (2 sentences: name the opening, describe the type of game).
2. For each key moment below — blunders, mistakes, AND any genuinely good moves you spot — write 2–3 sentences of coaching narration: what happened, what the right idea was, what chess principle applies.
3. Also flag any moves by ${S.username} that you consider genuinely strong or well-played. Those get positive narration.
4. Write a spoken conclusion (3 sentences: what decided the game, one thing done well, one thing to improve).
5. Write a 3–4 sentence coaching profile.

Return ONLY valid JSON (no markdown fences):
{
  "opening": "Name of the opening",
  "overview": "2 sentences spoken, ending with: Let's look at the key moments.",
  "keyMoments": [
    { "moveIndex": 0, "isGood": false, "narration": "spoken coaching text" }
  ],
  "conclusion": "3 sentence spoken closer",
  "profile": "3-4 sentence coaching profile of ${S.username}"
}

CRITICAL: moveIndex must exactly match the "moveIndex=N" value shown in the engine table above.
Do NOT use the full move number (1, 2, 3…) — use the moveIndex=N value from the table.
isGood: true for well-played moves, false for mistakes/blunders.

SPEECH RULES — narration is spoken aloud by TTS:
- Full piece names: King, Queen, Rook, Bishop, Knight, pawn — never abbreviate
- Squares as-is: e4, d5, h7
- Replace: x→"takes", +→"check", #→"checkmate", O-O→"castles kingside", O-O-O→"castles queenside"
- No chess symbols (!!, ??, etc.) — write them out as words
- No evaluation numbers — explain chess ideas, not scores
- No text outside the JSON`;
  } else {
    // Unannotated PGN — original full-commentary mode
    prompt =
`You are a chess coach and commentator reviewing a game for ${S.username} who played ${side}.
Use ${toneMap[S.tone]}. Be human, warm, and occasionally witty — like a knowledgeable friend watching the game with them, not a robot reciting evaluations.

PGN:
${pgn}

Return ONLY a valid JSON object (no markdown fences, no extra text) with this exact shape:
{
  "opening": "Name of the opening",
  "overview": "2-3 sentence spoken intro: name the opening, set the scene, mention what kind of game this turned out to be — tactical brawl, quiet positional grind, wild complications, etc. Make it engaging. Always end with: Let's analyze the game move by move.",
  "moves": [
    { "comment": "spoken comment for this move", "isKey": false }
  ],
  "conclusion": "3 sentence spoken closer: one sentence on what decided the game, one sentence on what ${S.username} did well, and one specific thing to focus on and improve next time.",
  "profile": "3-4 sentence coaching profile of ${S.username} based on this game"
}

RULES FOR MOVE COMMENTS:
- One per half-move, exactly ${total} total, in order
- Comments are spoken aloud by a TTS engine — write ONLY natural spoken English, never chess symbols or abbreviations
- PIECE NAMES: always write the full piece name — "King", "Queen", "Rook", "Bishop", "Knight", "pawn" — never K, Q, R, B, N
- SQUARES: say the square name as-is, e.g. "e4", "d5", "h7" (these are fine spoken)
- NOTATION SYMBOLS — replace every symbol with its spoken word:
    x or X  → "takes"
    +       → "check"
    #       → "checkmate"
    !       → "good move"
    !!      → "brilliant move"
    ?       → "mistake"
    ??      → "blunder"
    !?      → "interesting move"
    ?!      → "dubious move"
    O-O     → "castles kingside"
    O-O-O   → "castles queenside"
    =Q/=R/=B/=N → "promotes to Queen / Rook / Bishop / Knight"
- Sound human: use phrases like "nice idea here", "oof, this is where things unravel", "clever — puts real pressure on", "both sides are just going for it"
- Point out PATTERNS when you see them: repeated weaknesses, a tendency to trade pieces early, time pressure decisions, etc.
- Occasional dry humor or personality is welcome — don't be bland
- For routine moves in quiet positions, a brief observation is fine ("solid, keeps the tension")
- isKey: true for blunders, brilliant moves, key sacrifices, turning points — those comments must start with "Key move — "
- No text outside the JSON object`;
  }

  const res = await fetch('https://api.deepseek.com/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${S.dsKey}`
    },
    body: JSON.stringify({ model: 'deepseek-chat', max_tokens: 8192, messages: [{ role: 'user', content: prompt }] })
  });

  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `HTTP ${res.status}`);
  }

  const data = await res.json();
  const raw  = data.choices[0].message.content.trim()
    .replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '');

  let parsed;
  try { parsed = JSON.parse(raw); }
  catch { throw new Error('Bad JSON from API — try again.'); }

  if (isAnnotated && parsed.keyMoments) {
    // Convert keyMoments → full moves array
    const moves = Array.from({ length: total }, () => ({ comment: '', isKey: false }));
    for (const km of parsed.keyMoments) {
      const idx = km.moveIndex;
      if (idx >= 0 && idx < total) {
        moves[idx] = { comment: km.narration || '', isKey: true, isGood: !!km.isGood };
      }
    }
    // Force isKey for annotation blunders/mistakes regardless of DeepSeek
    if (annotations) {
      annotations.forEach((ann, i) => {
        if (i < total && (ann.classification === 'blunder' || ann.classification === 'mistake')) {
          moves[i].isKey = true;
        }
      });
    }
    parsed.moves = moves;
  } else {
    // Normalise moves array length (unannotated path)
    while (parsed.moves.length < total)
      parsed.moves.push({ comment: '', isKey: false });
    parsed.moves = parsed.moves.slice(0, total);
    parsed.moves.forEach(m => { m.isKey = m.isKey === true || m.isKey === 'true'; });
  }

  // Attach annotations to the returned object so loadGame can store them
  parsed._annotations = annotations;

  return parsed;
}

// ─────────────────────────────────────────
//  DEEPSEEK API — PROFILE
// ─────────────────────────────────────────
async function fetchProfile() {
  const notes = S.games
    .map((g, i) => `Game ${i + 1}: ${g.analysis.profile}`)
    .join('\n\n');

  const res = await fetch('https://api.deepseek.com/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${S.dsKey}`
    },
    body: JSON.stringify({
      model: 'deepseek-chat',
      max_tokens: 512,
      messages: [{
        role: 'user',
        content:
`Based on these per-game coaching notes for ${S.username}, give a 4-5 sentence spoken coaching profile.
Identify consistent patterns, genuine strengths, and the top 2 areas to work on.
Speak directly to them as their coach.
Return only the spoken text — no formatting, no bullet points.

${notes}`
      }]
    })
  });

  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `HTTP ${res.status}`);
  }

  const data = await res.json();
  return data.choices[0].message.content.trim();
}

// ─────────────────────────────────────────
//  LOAD GAME
// ─────────────────────────────────────────
function loadGame(pgn, analysis) {
  // Build position history
  const c    = new Chess();
  c.load_pgn(pgn, { sloppy: true });
  const hist = c.history({ verbose: true });

  const pos  = [];
  const tmp  = new Chess();
  pos.push(tmp.fen());
  hist.forEach(m => { tmp.move(m.san); pos.push(tmp.fen()); });

  // Player color
  const wName = pgHeader(pgn, 'White');
  const bName = pgHeader(pgn, 'Black');
  const isBlk = bName.toLowerCase() === S.username.toLowerCase();

  S.positions  = pos;
  S.hist       = hist;
  S.analysis   = analysis;
  S.annotations = analysis._annotations || null;
  S.idx        = -1;
  S.flip       = isBlk;
  S.games.push({ pgn, analysis });

  // Build eval bar and dot strip
  if (S.annotations) {
    $('eval-bar-wrap').classList.remove('hidden');
    $('dot-strip-wrap').classList.remove('hidden');
    buildDotStrip();
    updateEvalBar();
  } else {
    $('eval-bar-wrap').classList.add('hidden');
    $('dot-strip-wrap').classList.add('hidden');
  }

  // Header names / elos
  const wElo = pgHeader(pgn, 'WhiteElo');
  const bElo = pgHeader(pgn, 'BlackElo');

  if (!isBlk) {
    $('my-info').innerHTML  = `<strong>${wName}</strong>${wElo ? `<br>(${wElo})` : ''}`;
    $('opp-info').innerHTML = `<strong>${bName}</strong>${bElo ? `<br>(${bElo})` : ''}`;
  } else {
    $('my-info').innerHTML  = `<strong>${bName}</strong>${bElo ? `<br>(${bElo})` : ''}`;
    $('opp-info').innerHTML = `<strong>${wName}</strong>${wElo ? `<br>(${wElo})` : ''}`;
  }

  S.pendingOverview = analysis.overview || `${analysis.opening}. Let's analyze the game move by move.`;
  $('movlbl').classList.add('hidden');
  $('btn-start').classList.remove('hidden');
  $('btn-start').classList.remove('tapping');
  renderBoard();
  updateNav();
}

// ─────────────────────────────────────────
//  BOARD RENDER
// ─────────────────────────────────────────
const FILES = ['a','b','c','d','e','f','g','h'];

function renderBoard() {
  const el  = $('board');
  el.innerHTML = '';

  const fen  = S.positions[S.idx + 1];
  const c    = new Chess(fen);
  const ba   = c.board();          // ba[0] = rank-8 row; ba[7] = rank-1 row

  let fromSq = null, toSq = null;
  if (S.idx >= 0) {
    fromSq = S.hist[S.idx].from;
    toSq   = S.hist[S.idx].to;
  }

  for (let vr = 0; vr < 8; vr++) {
    for (let vc = 0; vc < 8; vc++) {
      let br, bc, sqName;

      if (!S.flip) {
        // White at bottom: visual row 0 = rank 8 (ba row 0)
        br     = vr;
        bc     = vc;
        sqName = FILES[vc] + (8 - vr);
      } else {
        // Black at bottom: visual row 0 = rank 1 (ba row 7)
        br     = 7 - vr;
        bc     = 7 - vc;
        sqName = FILES[7 - vc] + (vr + 1);
      }

      const piece = ba[br][bc];
      const dark  = (vr + vc) % 2 === 0;

      const div = document.createElement('div');
      div.className = 'sq ' + (dark ? 'dk' : 'lt');
      if (sqName === fromSq) div.classList.add('hf');
      if (sqName === toSq)   div.classList.add('ht');

      if (piece) {
        const sp = document.createElement('span');
        sp.className = 'piece ' + piece.color;
        sp.textContent = PC[piece.color + piece.type];
        div.appendChild(sp);
      }

      if (vc === 0) {
        const r = document.createElement('span');
        r.className = 'coord coord-rank';
        r.textContent = sqName[1];
        div.appendChild(r);
      }
      if (vr === 7) {
        const f = document.createElement('span');
        f.className = 'coord coord-file';
        f.textContent = sqName[0];
        div.appendChild(f);
      }

      el.appendChild(div);
    }
  }
}

// ─────────────────────────────────────────
//  NAV
// ─────────────────────────────────────────
function updateNav() {
  const total = S.hist.length;
  const i     = S.idx;

  $('btn-prev').disabled = i < 0;
  $('btn-next').disabled = false;

  if (i === -1) {
    $('movlbl').textContent = 'START';
  } else if (i === total - 1 && S.analysis?.conclusion) {
    const m   = S.hist[i];
    const num = Math.floor(i / 2) + 1;
    const san = m.color === 'w' ? `${num}. ${m.san}` : `${num}\u2026 ${m.san}`;
    $('movlbl').textContent = `${san} \u00b7\u00a0recap`;
  } else {
    const m   = S.hist[i];
    const num = Math.floor(i / 2) + 1;
    $('movlbl').textContent = m.color === 'w'
      ? `${num}. ${m.san}`
      : `${num}\u2026 ${m.san}`;
  }

  const mv = i >= 0 ? S.analysis?.moves[i] : null;
  if (mv?.isKey) {
    $('key-lbl').textContent = '★';
    $('key-lbl').style.color = mv.isGood ? 'var(--green)' : 'var(--gold)';
  } else {
    $('key-lbl').textContent = '';
  }

  // Play button: only in annotated mode, only when current move has a comment
  const hasComment = !!(S.annotations && mv?.comment);
  $('btn-play-comment').classList.toggle('hidden', !hasComment);
  if (!hasComment) $('btn-play-comment').textContent = '▶';

  if (S.annotations) { updateEvalBar(); updateDotStrip(); }
}

function buildDotStrip() {
  const strip = $('dot-strip');
  strip.innerHTML = '';
  const anns = S.annotations;
  const moves = S.analysis.moves;

  for (let i = 0; i < S.hist.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'mdot';
    dot.dataset.idx = i;

    const ann = anns && anns[i];
    const mv  = moves && moves[i];
    const hasComment = !!(mv && mv.comment);
    if (mv && mv.isKey && mv.isGood) {
      dot.classList.add('good-key');
    } else if (ann && ann.classification === 'blunder') {
      dot.classList.add('blunder');
    } else if (ann && ann.classification === 'mistake') {
      dot.classList.add('mistake');
    } else if (hasComment) {
      dot.classList.add('has-comment');
    } else if (ann && ann.classification === 'inaccuracy') {
      dot.classList.add('inaccuracy');
    }

    dot.onclick = () => jumpTo(i);
    strip.appendChild(dot);
  }
}

function updateEvalBar() {
  const anns = S.annotations;
  if (!anns) return;
  // eval after the current move; at start use first move's eval
  const ann = S.idx >= 0 ? anns[S.idx] : null;
  const pct = ann ? evalToBarPct(ann.eval, ann.isMate) : 50;
  $('eval-bar-fill').style.width = pct + '%';

  let label = '';
  if (ann && ann.eval !== null) {
    if (ann.isMate) label = ann.eval > 0 ? `M${ann.eval}` : `M${ann.eval}`;
    else label = (ann.eval > 0 ? '+' : '') + ann.eval.toFixed(1);
  }
  $('eval-bar-label').textContent = label;
}

function updateDotStrip() {
  const dots = $('dot-strip').querySelectorAll('.mdot');
  dots.forEach((d, i) => {
    d.classList.toggle('current', i === S.idx);
  });
  // Scroll the current dot into view
  const current = $('dot-strip').querySelector('.mdot.current');
  if (current) current.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
}

function jumpTo(targetIdx) {
  stopAudio();
  S.idx = targetIdx;
  renderBoard();
  updateNav();
  updateEvalBar();
  updateDotStrip();
}

$('btn-next').onclick    = advance;
$('btn-prev').onclick    = stepBack;
$('board-wrap').onclick  = advance;

$('btn-play-comment').onclick = () => {
  const btn = $('btn-play-comment');
  const mv = S.analysis?.moves[S.idx];
  if (!mv?.comment) return;
  if ($('adot').classList.contains('on')) {
    stopAudio();
    btn.textContent = '▶';
    return;
  }
  btn.textContent = '■';
  speak(mv.comment, () => { btn.textContent = '▶'; });
};

$('btn-start').onclick = () => {
  if (S.pendingOverview) { speak(S.pendingOverview); S.pendingOverview = null; }
  const btn = $('btn-start');
  btn.classList.add('tapping');
  btn.addEventListener('animationend', () => {
    btn.classList.add('hidden');
    btn.classList.remove('tapping');
    $('movlbl').classList.remove('hidden');
  }, { once: true });
};

function advance() {
  if (S.pendingOverview) return;
  const total = S.hist.length;
  if (S.idx >= total - 1) {
    if (S.analysis?.conclusion) speak(S.analysis.conclusion);
    return;
  }
  S.idx++;
  renderBoard();
  updateNav();

  const mv = S.analysis?.moves[S.idx];
  if (!S.annotations) {
    // Unannotated mode: voice on every move
    if (mv?.comment) speak(mv.comment);
  }
  // Annotated mode: user taps play button — no auto-speak
}

function stepBack() {
  if (S.idx < 0) return;
  stopAudio();
  S.idx--;
  renderBoard();
  updateNav();
}

// ─────────────────────────────────────────
//  TTS — Web Speech (sync) + Kokoro upgrade
// ─────────────────────────────────────────
function speak(text, onDone) {
  if (!text) { if (onDone) onDone(); return; }
  stopAudio();
  $('adot').classList.add('on');

  const cleanUp = () => { $('adot').classList.remove('on'); if (onDone) onDone(); };

  if (S.orKey) {
    // ── Kokoro preferred: fetch first, fall back to Web Speech only on failure ──
    // Pre-unlock audio on iOS by creating a silent Audio and playing it synchronously
    const unlock = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAA' +
      'EAAQAAwF0AAIC7AAACABAAZGF0YQAAAAA=');
    unlock.play().catch(() => {});

    fetch('https://openrouter.ai/api/v1/audio/speech', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${S.orKey}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'hexgrad/kokoro-82m', input: text, voice: 'af_sky', response_format: 'mp3' })
    })
    .then(r => r.ok ? r.blob() : Promise.reject())
    .then(blob => {
      if (!$('adot').classList.contains('on')) return;
      const url = URL.createObjectURL(blob);
      const aud = new Audio(url);
      S.curAudio = aud;
      const kdone = () => { URL.revokeObjectURL(url); cleanUp(); };
      aud.onended = kdone;
      aud.onerror = kdone;
      aud.play().catch(() => { S.curAudio = null; cleanUp(); });
    })
    .catch(() => cleanUp());
    return;
  }

  doWebSpeech();

  function doWebSpeech() {
    if (!('speechSynthesis' in window)) { cleanUp(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.93; u.pitch = 1;
    u.onend = cleanUp; u.onerror = cleanUp;
    speechSynthesis.speak(u);
  }
}

function stopAudio() {
  if (S.curAudio) { S.curAudio.pause(); S.curAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  $('adot').classList.remove('on');
}

// ─────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────
(function () {
  const saved = localStorage.getItem('iz_keys');
  if (saved) {
    try {
      const d = JSON.parse(saved);
      if (d.dsKey) { S.dsKey = d.dsKey; $('f-ds').value = d.dsKey; }
      if (d.orKey) { S.orKey = d.orKey; $('f-or').value = d.orKey; }
      if (d.username) { S.username = d.username; $('f-user').value = d.username; }
      if (d.tone) { S.tone = d.tone; pv('.tone').forEach(b => b.classList.toggle('on', b.dataset.v === d.tone)); }
      if (S.dsKey && S.username) { show('s-home'); refreshHome(); return; }
    } catch (_) {}
  }
  show('s-settings');
})();
